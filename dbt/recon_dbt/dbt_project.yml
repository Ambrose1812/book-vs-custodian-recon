name: 'recon_dbt'
version: '1.0.0'

# The connection profile, defined in dbt/profiles/profiles.yml.
profile: 'recon_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# One Postgres schema per layer. Staging models are views (light cleanup over raw).
# Intermediate models are tables: several marts and tests read them, and as views
# their split math was recomputed for every one of those reads.
models:
  recon_dbt:
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    eval:
      +schema: eval
      +materialized: table

vars:
  # Share differences up to this size are rounding noise, not breaks.
  recon_tolerance: 0.001

  # Requires-action thresholds. These mirror classify/action_policy.py, keep them in sync.
  gap_bps_review: 0.5
  gap_bps_escalate: 5.0
  nav_materiality_bps: 50.0
  relative_gap_escalate: 0.10
  age_review_trading_days: 3
  age_escalate_trading_days: 6
  recurrence_window_trading_days: 20
