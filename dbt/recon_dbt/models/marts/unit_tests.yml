unit_tests:
  - name: test_fct_positions_two_splits
    description: >
      Two 2-for-1 splits (June, August) with a buy in between and a sell after.
      Verifies splits compound, apply only to earlier shares, and that prices
      stay unadjusted.
    model: fct_positions
    given:
      - input: ref('stg_transactions')
        rows:
          - {transaction_id: 1, security_id: 'FIGI1', trade_date: '2026-04-16', side: 'BUY',  quantity: 100}
          - {transaction_id: 2, security_id: 'FIGI1', trade_date: '2026-07-01', side: 'BUY',  quantity: 50}
          - {transaction_id: 3, security_id: 'FIGI1', trade_date: '2026-09-01', side: 'SELL', quantity: 30}
      - input: ref('dim_security_master')
        rows:
          - {security_id: 'FIGI1', ticker: 'AAPL'}
      - input: ref('int_prices_split_indexed')
        rows:
          - {ticker: 'AAPL', price_date: '2026-04-16', close_price: 400, cum_split_factor: 1}
          - {ticker: 'AAPL', price_date: '2026-07-01', close_price: 200, cum_split_factor: 2}
          - {ticker: 'AAPL', price_date: '2026-09-01', close_price: 101, cum_split_factor: 4}
    expect:
      rows:
        - {transaction_id: 1, shares_held: '100.000000', market_value: 40000}
        - {transaction_id: 2, shares_held: '250.000000', market_value: 50000}
        - {transaction_id: 3, shares_held: '470.000000', market_value: 47470}

  - name: test_int_prices_split_indexed_compounds_splits
    description: >
      Verifies the running log-sum product: two 2-for-1 splits compound to 4,
      the index carries forward on non-split days, and each ticker's index
      restarts independently (partition by ticker).
    model: int_prices_split_indexed
    given:
      - input: ref('stg_prices')
        rows:
          - {ticker: 'AAPL', price_date: '2026-04-16', close_price: 400, split_factor: 1}
          - {ticker: 'AAPL', price_date: '2026-06-01', close_price: 200, split_factor: 2}
          - {ticker: 'AAPL', price_date: '2026-06-02', close_price: 201, split_factor: 1}
          - {ticker: 'AAPL', price_date: '2026-08-03', close_price: 101, split_factor: 2}
          - {ticker: 'MSFT', price_date: '2026-04-16', close_price: 300, split_factor: 1}
          - {ticker: 'MSFT', price_date: '2026-06-01', close_price: 301, split_factor: 1}
    expect:
      rows:
        - {ticker: 'AAPL', price_date: '2026-04-16', cum_split_factor: '1.00000000'}
        - {ticker: 'AAPL', price_date: '2026-06-01', cum_split_factor: '2.00000000'}
        - {ticker: 'AAPL', price_date: '2026-06-02', cum_split_factor: '2.00000000'}
        - {ticker: 'AAPL', price_date: '2026-08-03', cum_split_factor: '4.00000000'}
        - {ticker: 'MSFT', price_date: '2026-04-16', cum_split_factor: '1.00000000'}
        - {ticker: 'MSFT', price_date: '2026-06-01', cum_split_factor: '1.00000000'}

  - name: test_fct_recon_positions_classification
    description: >
      One security per recon status on a single trading day. A matches the
      trade-date book; B differs from the trade-date book but equals the
      settled book (trades not yet settled, so a timing difference, not a
      break); C is held by the book but absent from the custodian; D is held
      by the custodian but absent from the book; E disagrees after settlement.
    model: fct_recon_positions
    given:
      - input: ref('int_prices_split_indexed')
        rows:
          - {ticker: 'X', price_date: '2026-06-01'}
      - input: ref('int_book_daily_holdings')
        rows:
          - {as_of_date: '2026-06-01', security_id: 'A', quantity_trade_basis: 100, quantity_settled_basis: 100}
          - {as_of_date: '2026-06-01', security_id: 'B', quantity_trade_basis: 100, quantity_settled_basis: 0}
          - {as_of_date: '2026-06-01', security_id: 'C', quantity_trade_basis: 50,  quantity_settled_basis: 50}
          - {as_of_date: '2026-06-01', security_id: 'E', quantity_trade_basis: 100, quantity_settled_basis: 100}
      - input: ref('stg_custodian_holdings')
        rows:
          - {as_of_date: '2026-06-01', security_id: 'A', quantity: 100}
          - {as_of_date: '2026-06-01', security_id: 'D', quantity: 30}
          - {as_of_date: '2026-06-01', security_id: 'E', quantity: 1000}
    expect:
      rows:
        - {security_id: 'A', recon_status: 'matched',              is_break: false}
        - {security_id: 'B', recon_status: 'timing_difference',    is_break: false}
        - {security_id: 'C', recon_status: 'missing_on_custodian', is_break: true}
        - {security_id: 'D', recon_status: 'missing_in_book',      is_break: true}
        - {security_id: 'E', recon_status: 'quantity_break',       is_break: true}

  - name: test_fct_break_episodes_gaps_and_weekend
    description: >
      Security A breaks Tue-Wed, clears Thu, then breaks Fri and the following
      Mon (no row for the weekend), so it has two episodes and the second spans
      the weekend as one. Security C breaks only on the first day and has
      cleared. Security B is clean and only supplies the calendar. The latest
      date is Mon 2026-06-08, so only A's second episode is open.
    model: fct_break_episodes
    given:
      - input: ref('fct_recon_positions')
        rows:
          - {as_of_date: '2026-06-01', security_id: 'B', recon_status: 'matched',              is_break: false}
          - {as_of_date: '2026-06-02', security_id: 'B', recon_status: 'matched',              is_break: false}
          - {as_of_date: '2026-06-03', security_id: 'B', recon_status: 'matched',              is_break: false}
          - {as_of_date: '2026-06-04', security_id: 'B', recon_status: 'matched',              is_break: false}
          - {as_of_date: '2026-06-05', security_id: 'B', recon_status: 'matched',              is_break: false}
          - {as_of_date: '2026-06-08', security_id: 'B', recon_status: 'matched',              is_break: false}
          - {as_of_date: '2026-06-01', security_id: 'C', recon_status: 'quantity_break',        is_break: true}
          - {as_of_date: '2026-06-02', security_id: 'C', recon_status: 'matched',               is_break: false}
          - {as_of_date: '2026-06-02', security_id: 'A', recon_status: 'quantity_break',        is_break: true}
          - {as_of_date: '2026-06-03', security_id: 'A', recon_status: 'quantity_break',        is_break: true}
          - {as_of_date: '2026-06-04', security_id: 'A', recon_status: 'matched',               is_break: false}
          - {as_of_date: '2026-06-05', security_id: 'A', recon_status: 'missing_on_custodian',  is_break: true}
          - {as_of_date: '2026-06-08', security_id: 'A', recon_status: 'quantity_break',        is_break: true}
    expect:
      rows:
        - {security_id: 'A', episode_start: '2026-06-02', episode_end: '2026-06-03', days_in_break: 2, first_status: 'quantity_break',       last_status: 'quantity_break', is_open: false, age_bucket: '1-2 days'}
        - {security_id: 'A', episode_start: '2026-06-05', episode_end: '2026-06-08', days_in_break: 2, first_status: 'missing_on_custodian', last_status: 'quantity_break', is_open: true,  age_bucket: '1-2 days'}
        - {security_id: 'C', episode_start: '2026-06-01', episode_end: '2026-06-01', days_in_break: 1, first_status: 'quantity_break',       last_status: 'quantity_break', is_open: false, age_bucket: '1-2 days'}
