version: 2

models:
  - name: dim_security_master
    columns:
      - name: security_id
        tests:
          - unique
          - not_null

  - name: fct_positions
    columns:
      - name: security_id
        tests:
          - not_null
      - name: shares_held
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: fct_recon_positions
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [as_of_date, security_id]
    columns:
      - name: recon_status
        tests:
          - not_null
          - accepted_values:
              values: [matched, timing_difference, missing_on_custodian, missing_in_book, quantity_break]

  - name: fct_break_episodes
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [security_id, episode_start]
    columns:
      - name: days_in_break
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: age_bucket
        tests:
          - accepted_values:
              values: ['1-2 days', '3-5 days', '6-10 days', '11-30 days', '31+ days']

  - name: fct_recon_daily_kpis
    columns:
      - name: as_of_date
        tests:
          - unique
          - not_null
      - name: match_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

  - name: fct_break_cause_baseline
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [security_id, first_break_date]
    columns:
      - name: cause_predicted
        tests:
          - not_null
          - accepted_values:
              values: [missing_trade, duplicate_trade, wrong_quantity, split_not_applied, unknown]

  - name: fct_break_requires_action
    description: One row per open break episode, with a requires-action level (1 to 3) and the reasons.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [security_id, episode_start]
    columns:
      - name: action_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: action_reason
        tests:
          - not_null

  - name: fct_break_action_history
    description: One row per security, break episode, and trading day, with the requires-action level as of that day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [security_id, episode_start, as_of_date]
    columns:
      - name: action_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
