          - {security_id: 'P', as_of_date: '2026-06-02', book_quantity_settled_basis: 90000, difference_vs_settled_basis: 0}
          - {security_id: 'P', as_of_date: '2026-06-03', book_quantity_settled_basis: 90000, difference_vs_settled_basis: 0}
          - {security_id: 'P', as_of_date: '2026-06-04', book_quantity_settled_basis: 90000, difference_vs_settled_basis: 0}
          - {security_id: 'P', as_of_date: '2026-06-05', book_quantity_settled_basis: 90000, difference_vs_settled_basis: 0}
          - {security_id: 'P', as_of_date: '2026-06-08', book_quantity_settled_basis: 90000, difference_vs_settled_basis: 0}
