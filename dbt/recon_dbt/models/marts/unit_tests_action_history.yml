      - input: ref('fct_break_episodes')
        rows:
          - {security_id: 'A', episode_start: '2026-06-10', episode_end: '2026-06-10', last_status: 'quantity_break', is_open: true}
          - {security_id: 'B', episode_start: '2026-06-10', episode_end: '2026-06-10', last_status: 'quantity_break', is_open: true}
          - {security_id: 'C', episode_start: '2026-06-10', episode_end: '2026-06-10', last_status: 'quantity_break', is_open: true}
