version: 2

models:
  - name: stg_openfigi_mappings
    columns:
      - name: figi
        tests:
          - unique
          - not_null

  - name: stg_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

  - name: stg_prices
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, price_date]
    columns:
      - name: split_factor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
